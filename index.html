<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A0A14">
  <meta name="description" content="My Life OS v3.0 — Personal Productivity System">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Life OS">
  <title>My Life OS v3.0</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ═══════════════════════════════════════ SPLASH SCREEN ═══ -->
  <div id="splash-screen" class="splash-screen">
    <div class="splash-content">
      <div class="splash-logo-wrap">
        <div class="splash-icon-ring">
          <svg class="splash-bolt" viewBox="0 0 24 24" fill="none">
            <path d="M13 2L4.09 12.97H11L10 22L20.14 11H13L13 2Z" fill="currentColor"/>
          </svg>
        </div>
        <h1 class="splash-title">My Life OS</h1>
        <span class="splash-version">v3.0</span>
      </div>
      <div class="splash-bar-track"><div class="splash-bar-fill" id="splash-bar"></div></div>
      <p class="splash-tagline">Loading your world…</p>
    </div>
  </div>

  <!-- ═══════════════════════════════════════ PIN LOCK SCREEN ═══ -->
  <div id="pin-screen" class="pin-screen hidden">
    <div class="pin-backdrop"></div>
    <div class="pin-card">
      <div class="pin-avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h2 class="pin-title">Welcome Back</h2>
      <p class="pin-subtitle" id="pin-subtitle">Enter your 4-digit PIN</p>

      <div class="pin-dots" id="pin-dots">
        <div class="pin-dot" data-index="0"></div>
        <div class="pin-dot" data-index="1"></div>
        <div class="pin-dot" data-index="2"></div>
        <div class="pin-dot" data-index="3"></div>
      </div>
      <p class="pin-error hidden" id="pin-error">Incorrect PIN — try again</p>

      <div class="pin-keypad" id="pin-keypad">
        <button class="key-btn" data-key="1">1</button>
        <button class="key-btn" data-key="2">2</button>
        <button class="key-btn" data-key="3">3</button>
        <button class="key-btn" data-key="4">4</button>
        <button class="key-btn" data-key="5">5</button>
        <button class="key-btn" data-key="6">6</button>
        <button class="key-btn" data-key="7">7</button>
        <button class="key-btn" data-key="8">8</button>
        <button class="key-btn" data-key="9">9</button>
        <button class="key-btn key-bio hidden" id="key-bio" title="Biometric">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </button>
        <button class="key-btn" data-key="0">0</button>
        <button class="key-btn key-del" id="key-del">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════ APP SHELL ═══ -->
  <div id="app" class="app hidden">

    <!-- Top Header -->
    <header class="app-header" id="app-header">
      <div class="hdr-left">
        <button class="icon-btn ripple" id="menu-toggle" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="hdr-title" id="hdr-title">Dashboard</span>
      </div>
      <div class="hdr-right">
        <button class="icon-btn ripple" id="global-search-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
        <button class="icon-btn ripple" id="theme-toggle" aria-label="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <div class="hdr-avatar" id="hdr-avatar">B</div>
      </div>
    </header>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar / Drawer -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none"><path d="M13 2L4.09 12.97H11L10 22L20.14 11H13L13 2Z" fill="currentColor"/></svg>
          </div>
          <div>
            <div class="brand-name">My Life OS</div>
            <div class="brand-ver">v3.0</div>
          </div>
        </div>
        <button class="icon-btn sidebar-close-btn" id="sidebar-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="sidebar-profile">
        <div class="profile-avatar" id="sidebar-avatar">B</div>
        <div class="profile-info">
          <div class="profile-name" id="sidebar-name">Bhuvan</div>
          <div class="profile-role">Personal OS</div>
        </div>
      </div>

      <div class="sidebar-nav" id="sidebar-nav">
        <!-- populated by app.js -->
      </div>

      <div class="sidebar-footer">
        <div class="sidebar-date" id="sidebar-date"></div>
        <div class="sidebar-copy">© 2025 My Life OS</div>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main class="app-main" id="app-main">
      <div class="module-loading" id="module-loading">
        <div class="spinner"></div>
      </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" id="bottom-nav">
      <!-- populated by app.js -->
    </nav>

    <!-- Floating Action Button -->
    <button class="fab" id="fab" aria-label="Quick add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>

    <!-- FAB Speed-dial Menu -->
    <div class="fab-menu hidden" id="fab-menu"></div>

    <!-- Global Search Overlay -->
    <div class="search-overlay hidden" id="search-overlay">
      <div class="search-panel">
        <div class="search-bar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search-input" class="search-input" placeholder="Search tasks, notes, links…" autocomplete="off">
          <button class="icon-btn" id="search-close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="search-results" id="search-results">
          <p class="search-placeholder">Start typing to search…</p>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container" aria-live="polite"></div>

    <!-- Modal -->
    <div class="modal-overlay hidden" id="modal-overlay">
      <div class="modal-card" id="modal-card">
        <div class="modal-header">
          <h3 class="modal-title" id="modal-title">Dialog</h3>
          <button class="icon-btn modal-close-btn" id="modal-close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
      </div>
    </div>

  </div><!-- /#app -->

  <!-- ═══════════════ SCRIPTS ═══════════════ -->

  <!-- ⚡ BOOTSTRAP — MUST be the very first script.
       Modules call MLO.registerModule() the instant their file
       executes. app.js loads LAST, so if registerModule is defined
       there, every module throws "not a function" and nothing
       registers → spinner forever. This tiny inline block fixes it
       by making the registry available before any <script src> runs. -->
  <script>
    window.MLO = {};
    window.MLO.modules = {};
    window.MLO.registerModule = function (def) {
      window.MLO.modules[def.id] = def;
    };
  </script>

  <!-- Components (load first — no deps) -->
  <script src="components/utils.js"></script>
  <script src="components/charts.js"></script>
  <script src="components/toast.js"></script>
  <script src="components/modal.js"></script>

  <!-- Modules -->
  <script src="modules/dashboard.js"></script>
  <script src="modules/habits.js"></script>
  <script src="modules/tasks.js"></script>
  <script src="modules/calendar.js"></script>
  <script src="modules/office.js"></script>
  <script src="modules/expenses.js"></script>
  <script src="modules/notes.js"></script>
  <script src="modules/mytube.js"></script>
  <script src="modules/links.js"></script>
  <script src="modules/health.js"></script>
  <script src="modules/goals.js"></script>
  <script src="modules/ai-assistant.js"></script>
  <script src="modules/analytics.js"></script>
  <script src="modules/backup.js"></script>
  <script src="modules/security.js"></script>

  <!-- Core app (last) -->
  <script src="app.js"></script>

  <!-- Service Worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
